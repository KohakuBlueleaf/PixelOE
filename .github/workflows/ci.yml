name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Syntax check
        run: python -m compileall -q src nodes client/demo-gr.py demo.py demo-torch.py test_oe_diff.py experiments
      - name: Ruff check
        run: ruff check src nodes client tests experiments
      - name: Test
        run: pytest
      - name: Build package
        run: python -m build
